<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>რიგის ეკრანი</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0b1f1d;color:#e6fffa;font-family:"Noto Sans Georgian","BPG Nino Mtavruli",system-ui,sans-serif;display:grid;grid-template-columns:1fr 28%;grid-template-rows:auto 1fr;transition:background .2s}
body.flash{background:#0f766e}
header{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;padding:2vh 3vw;font-size:clamp(18px,3vw,40px)}
#clock{font-variant-numeric:tabular-nums;font-weight:700}
.main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2vw}
.lbl{font-size:clamp(20px,3vw,44px);color:#7fd1c7}
#big{font-size:clamp(48px,13vw,220px);font-weight:800;line-height:1.1;margin-top:2vh}
#big.empty{font-size:clamp(28px,5vw,80px);color:#7fd1c7;font-weight:500}
.side{background:#0a3a36;padding:2vh 2vw;overflow:hidden}
.side h2{margin:0 0 2vh;font-size:clamp(18px,2.4vw,34px);color:#7fd1c7;font-weight:500}
.side li{list-style:none;font-size:clamp(20px,3vw,46px);padding:1.4vh 0;border-bottom:1px solid #0f766e}
.side ul{margin:0;padding:0}
#snd{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;border:0;font:inherit;font-size:clamp(22px,4vw,50px);cursor:pointer;z-index:5}
@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}header,.side{grid-column:1}}
@media(prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<button id="snd">დააჭირეთ ხმის ჩასართავად</button>
<header><span>კლინიკა · რიგი</span><span id="clock"></span></header>
<div class="main">
  <div class="lbl">გამოძახებულია</div>
  <div id="big" class="empty">ელოდეთ გამოძახებას</div>
</div>
<aside class="side"><h2>წინა გამოძახებები</h2><ul id="prev"></ul></aside>
<script>
const KEY='clinic_state';
let lastId=null,first=true,ctx=null;
const $=id=>document.getElementById(id);
$('snd').onclick=()=>{ctx=new (window.AudioContext||window.webkitAudioContext)();$('snd').remove()};
function beep(){
  if(!ctx)return;
  [0,.25].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=i?1100:800;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(.25,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.22);
    o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.25)});
}
function tick(){
  $('clock').textContent=new Date().toLocaleTimeString('ka-GE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  const calls=(s&&s.calls)||[];
  if(!calls.length){lastId=null;$('big').className='empty';$('big').textContent='ელოდეთ გამოძახებას';$('prev').innerHTML='';first=false;return}
  const cur=calls[calls.length-1];
  $('big').className='';$('big').textContent=`${cur.ticket} → ოთახი ${cur.room}`;
  $('prev').innerHTML=calls.slice(-6,-1).reverse().map(c=>`<li>${c.ticket} → ოთახი ${c.room}</li>`).join('');
  if(cur.id!==lastId){
    if(!first){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),900);beep()}
    lastId=cur.id;
  }
  first=false;
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
